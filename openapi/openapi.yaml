openapi: 3.1.0
info:
  title: Household Account API
  version: 0.1.0
  description: |
    家計簿アプリケーションの HTTP API 契約です。
    クライアントはエラーの分岐に `message` ではなく `code` を使用してください。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: ローカル開発環境
tags:
  - name: System
    description: 稼働確認
  - name: Users
    description: ユーザー登録
  - name: Authentication
    description: 認証
  - name: Categories
    description: 支出カテゴリ
  - name: Receipts
    description: レシートと集計
paths:
  /:
    get:
      operationId: healthCheck
      summary: アプリケーションの稼働を確認する
      tags:
        - System
      security: []
      responses:
        "200":
          description: アプリケーションが応答可能
          content:
            text/plain:
              schema:
                type: string
                const: Hello Ktor!
              example: Hello Ktor!
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users:
    post:
      operationId: createUser
      summary: ユーザーを登録する
      tags:
        - Users
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              name: alice
              password: correct-horse-battery-staple
      responses:
        "201":
          description: ユーザーを登録した。レスポンスボディは返さない
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/UserAlreadyExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /login:
    post:
      operationId: login
      summary: アクセストークンを取得する
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              name: alice
              password: correct-horse-battery-staple
      responses:
        "200":
          description: 認証に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9...
                tokenType: Bearer
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /categories:
    get:
      operationId: listCategories
      summary: 支出カテゴリを取得する
      tags:
        - Categories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: カテゴリ一覧。要素の順序は保証しない
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
              example:
                - id: 00000000-0000-0000-0000-000000000001
                  name: 食費
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /receipts:
    post:
      operationId: createReceipt
      summary: レシートを登録する
      tags:
        - Receipts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceiptRequest"
            example:
              dateTime: "2024-01-01T12:30:00"
              details:
                - itemName: 卵
                  amount: 100
                  categoryId: 00000000-0000-0000-0000-000000000001
      responses:
        "201":
          description: レシートを登録した。レスポンスボディは返さない
        "400":
          description: JSON またはレシートの内容が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRequest:
                  summary: JSON の形式が不正
                  value:
                    code: invalid_request
                    message: Request is invalid
                invalidReceipt:
                  summary: レシートの内容が不正
                  value:
                    code: invalid_receipt
                    message: Receipt is invalid
        "401":
          $ref: "#/components/responses/InvalidToken"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /receipts/summaries:
    get:
      operationId: getReceiptSummaries
      summary: カテゴリ別の支出合計を取得する
      description: |
        `from` と `to` は省略可能で、指定した日付を両端とも含みます。
        両方を指定する場合は `from` が `to` 以下でなければなりません。
      tags:
        - Receipts
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: 集計開始日。この日の 00:00:00 以降を含む
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: to
          in: query
          required: false
          description: 集計終了日。この日の末尾までを含む
          schema:
            type: string
            format: date
          example: "2024-01-31"
      responses:
        "200":
          description: |
            カテゴリ名をキー、合計金額を値とする JSON オブジェクト。
            対象データがなければ空オブジェクトを返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptSummary"
              examples:
                withData:
                  value:
                    食費: 350
                empty:
                  value: {}
        "400":
          $ref: "#/components/responses/InvalidDateRange"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "/login で取得したアクセストークンを指定する"
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
        - name
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ".*\\S.*"
          description: 空白だけではないユーザー名
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: 8文字以上72文字以下、かつUTF-8で72バイト以下のパスワード
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
      properties:
        accessToken:
          type: string
          minLength: 1
          description: JWT アクセストークン
        tokenType:
          type: string
          const: Bearer
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
    CreateReceiptRequest:
      type: object
      additionalProperties: false
      required:
        - dateTime
        - details
      properties:
        dateTime:
          type: string
          format: date-time-local
          description: タイムゾーンを含まない ISO 8601 形式の日時
          examples:
            - "2024-01-01T12:30:00"
        details:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReceiptDetail"
    ReceiptDetail:
      type: object
      additionalProperties: false
      required:
        - itemName
        - amount
        - categoryId
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ".*\\S.*"
          description: 空白だけの値は使用できない
        amount:
          type: integer
          format: int32
          minimum: 1
          description: 最小通貨単位による正の整数
        categoryId:
          type: string
          format: uuid
          description: 存在するカテゴリの ID
    ReceiptSummary:
      type: object
      description: カテゴリ名ごとの支出合計
      additionalProperties:
        type: integer
        format: int32
        minimum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: クライアントが分岐に使用する安定したエラーコード
          enum:
            - invalid_request
            - invalid_credentials
            - invalid_token
            - user_already_exists
            - invalid_receipt
            - invalid_date_range
            - unsupported_media_type
            - internal_server_error
        message:
          type: string
          description: 人間向けの説明。クライアントの分岐には使用しない
  responses:
    InvalidRequest:
      description: リクエストの形式または値が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: Request is invalid
    InvalidCredentials:
      description: ユーザー名またはパスワードが一致しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_credentials
            message: Invalid credentials
    InvalidToken:
      description: アクセストークンがない、無効、期限切れ、または対象ユーザーが存在しない
      headers:
        WWW-Authenticate:
          description: Bearer 認証が必要であることを示す
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_token
            message: Authentication is required
    UserAlreadyExists:
      description: 同じ名前のユーザーが既に存在する
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: user_already_exists
            message: User already exists
    InvalidDateRange:
      description: 集計期間の形式または前後関係が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_date_range
            message: Date range is invalid
    UnsupportedMediaType:
      description: Content-Type が application/json ではない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unsupported_media_type
            message: Content-Type must be application/json
    InternalServerError:
      description: 予期しないサーバーエラー。内部情報はレスポンスへ含めない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal_server_error
            message: Internal server error
